[project]
name = "speedstats"
version = "4.0.0"
description = "Scrapes speedrun.com, scores every run, and serves the rankings at speedstats.app"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.3",
    "httpx[http2]>=0.28",
    "pyarrow>=19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mysql-connector-python>=9",
    "ijson>=3.5.1",
    "httpx>=0.28.1",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["speedstats", "scraper", "scraper.sql", "api"]

[tool.setuptools.package-data]
"scraper.sql" = ["*.sql"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
