name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, speedstats]
    steps:
      - uses: actions/checkout@v4
      - name: Write /opt/speedstats/.env from repository secrets and variables
        # Secrets: Settings -> Secrets and variables -> Actions. Editing one and re-running Deploy updates the VM;
        # the file never lives in the repo. Non-secret settings are repository *variables*.
        run: |
          umask 077
          cat > /opt/speedstats/.env <<'EOF'
          SRC_PROXIES=${{ secrets.SRC_PROXIES }}
          EXCLUDED_PLAYERS=${{ secrets.EXCLUDED_PLAYERS }}
          CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ vars.R2_BUCKET || 'speedstats' }}
          PUBLIC_URL=${{ vars.PUBLIC_URL || 'https://new.speedstats.app' }}
          SRC_PER_PROXY_CONCURRENCY=${{ vars.SRC_PER_PROXY_CONCURRENCY || '2' }}
          SRC_PER_PROXY_RPM=${{ vars.SRC_PER_PROXY_RPM || '100' }}
          EXCLUDED_GAMES=${{ vars.EXCLUDED_GAMES || 'w6jrzxdj' }}
          EXCLUDED_CATEGORIES=${{ vars.EXCLUDED_CATEGORIES || 'n2y350ed,5dw43j0k' }}
          MIN_LEADERBOARDS=${{ vars.MIN_LEADERBOARDS || '600000' }}
          EOF
      - name: Pull and restart the API
        env:
          SPEEDSTATS_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          docker compose pull api dozzle
          docker compose up -d api dozzle
          docker image prune -f
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs --tail 100 api
          exit 1
