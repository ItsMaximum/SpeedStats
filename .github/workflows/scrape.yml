name: Weekly scrape

on:
  schedule:
    # Sundays 2 AM Eastern. GitHub cron is UTC only: 06:00 UTC during EDT (Mar-Nov), so 1 AM ET during EST.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      resume:
        description: "Resume the latest unfinished crawl instead of starting a new one"
        type: boolean
        default: true
      force:
        description: "Crawl even if the live data is younger than MIN_CRAWL_INTERVAL_DAYS (3)"
        type: boolean
        default: true

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, speedstats]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - name: Mask proxy names in this run's log
        env:
          SRC_PROXIES: ${{ secrets.SRC_PROXIES }}
        run: |
          for p in ${SRC_PROXIES//,/ }; do echo "::add-mask::$p"; done
      - name: Crawl, score, validate, publish
        env:
          RESUME: ${{ github.event_name == 'schedule' || inputs.resume }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          # run the scraper from the exact image the api is serving (pinned by the last Deploy), no pull needed
          export SPEEDSTATS_IMAGE=$(docker inspect --format '{{.Config.Image}}' speedstats-api-1)
          echo "image: $SPEEDSTATS_IMAGE"
          rm -f /opt/speedstats/data/step-summary.md
          FLAGS=""
          [ "$RESUME" = "true" ] && FLAGS="$FLAGS --resume"
          [ "$FORCE" = "true" ] && FLAGS="$FLAGS --force"
          docker compose run --rm scraper all $FLAGS
      - name: Stop the scraper container if this run was cancelled
        if: cancelled()
        run: |
          ids=$(docker ps -q --filter label=com.docker.compose.project=speedstats --filter label=com.docker.compose.service=scraper)
          if [ -n "$ids" ]; then docker stop $ids; echo "stopped scraper container(s); the next run resumes the crawl"; fi
      - name: Job summary
        if: always()
        run: |
          if [ -f /opt/speedstats/data/step-summary.md ]; then
            cat /opt/speedstats/data/step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
