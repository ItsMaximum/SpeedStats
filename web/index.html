<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/logo.webp" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <meta property="og:site_name" content="SpeedStats" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:url" content="__URL__" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <main>
      <h1 class="brand">
        <a href="/"><img src="/logo.webp" alt="" width="44" height="44" /><span class="wordmark">SpeedStats</span></a>
      </h1>
      <div id="root">
        <div class="site-loading" role="status" aria-label="Loading">
          <span class="spinner" style="width: 40px; height: 40px" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
          </span>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
